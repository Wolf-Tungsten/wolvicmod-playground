<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700">
  <defs>
    <marker id="mG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="mB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="mGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="mO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>

    <text x="560" y="44" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">东江实例（HN-F）内部：功能四分</text>

    <!-- 东江实例边界 -->
    <rect x="100" y="70" width="960" height="560" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- 交叉开关 -->
    <rect x="130" y="140" width="150" height="280" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="205" y="168" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">交叉开关</text>
    <text x="205" y="186" text-anchor="middle" font-size="10.5" fill="#64748b">ChiXbar</text>
    <text x="205" y="214" text-anchor="middle" font-size="11" fill="#334155">入向：按 dirBank</text>
    <text x="205" y="234" text-anchor="middle" font-size="11" fill="#334155">分流到两个前端</text>
    <text x="205" y="254" text-anchor="middle" font-size="11" fill="#334155">——块偏移之上</text>
    <text x="205" y="274" text-anchor="middle" font-size="11" fill="#334155">那一位选择</text>
    <text x="205" y="312" text-anchor="middle" font-size="11" fill="#334155">出向：汇成一路</text>
    <text x="205" y="332" text-anchor="middle" font-size="11" fill="#334155">交 HomeWrapper</text>

    <!-- 前端分组框 -->
    <rect x="310" y="132" width="300" height="304" rx="12" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="460" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">前端 Frontend ×2（按 dirBank 分治）</text>

    <!-- 前端 0 -->
    <rect x="320" y="140" width="280" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="334" y="164" font-size="13.5" font-weight="bold" fill="#1e3a8a">前端 0（dirBank 0）</text>
    <text x="334" y="188" font-size="11" fill="#1f2937">任务缓冲 ×32：待发 / 重试 / 睡眠</text>
    <text x="334" y="210" font-size="11" fill="#1f2937">PoS 表：在途登记 · 睡眠唤醒</text>
    <text x="334" y="232" font-size="11" fill="#1f2937">流水：登记 → 查目录 → 译码开处方</text>
    <text x="334" y="254" font-size="11" fill="#1f2937">快速旁路：DBID 凭证应答</text>

    <!-- 前端 1 -->
    <rect x="320" y="290" width="280" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="334" y="314" font-size="13.5" font-weight="bold" fill="#1e3a8a">前端 1（dirBank 1）</text>
    <text x="334" y="342" font-size="11" fill="#1f2937">与前端 0 同构</text>
    <text x="334" y="366" font-size="11" fill="#1f2937">辖区：另一半缓存行</text>
    <text x="334" y="390" font-size="11" fill="#1f2937">——相邻行交替归属两前端</text>

    <!-- 目录（贯通两个前端的高度） -->
    <rect x="640" y="140" width="400" height="280" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="840" y="163" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#14532d">目录 Directory（按 dirBank 分 2 片）</text>
    <rect x="652" y="176" width="376" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="840" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">LLC 目录</text>
    <text x="840" y="222" text-anchor="middle" font-size="11" fill="#1f2937">在不在 · 哪一路 · 何状态（含 PLRU）</text>
    <rect x="652" y="258" width="376" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="840" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">监听过滤器</text>
    <text x="840" y="304" text-anchor="middle" font-size="11" fill="#1f2937">副本散在哪些 L2——按账点名，不必广播</text>
    <text x="840" y="352" text-anchor="middle" font-size="10.5" fill="#64748b">两套账各按 dirBank 切两片，与两个前端一一对应</text>
    <text x="840" y="372" text-anchor="middle" font-size="10.5" fill="#64748b">多拍流水读出 · 改账权在后端</text>

    <!-- 后端（横在前端分组框下方的宽条） -->
    <rect x="320" y="470" width="420" height="110" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="334" y="494" font-size="13.5" font-weight="bold" fill="#7c2d12">后端 Backend</text>
    <text x="334" y="518" font-size="11" fill="#1f2937">提交项 ×112（在途事务上限）</text>
    <text x="334" y="540" font-size="11" fill="#1f2937">执行机：读 · 写 · 监听 · 替换</text>
    <text x="334" y="562" font-size="11" fill="#1f2937">完结：改账 → 清 PoS → 释放槽位</text>

    <!-- 数据 -->
    <rect x="780" y="470" width="260" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="794" y="494" font-size="13.5" font-weight="bold" fill="#4c1d95">数据 DataBlock</text>
    <text x="794" y="518" font-size="11" fill="#1f2937">缓存行数据本体（4 个存储 bank）</text>
    <text x="794" y="540" font-size="11" fill="#1f2937">写数据缓冲 4 KiB + DBID 凭证池 ×128</text>
    <text x="794" y="562" font-size="11" fill="#1f2937">自带搬运执行机</text>

    <!-- 内部箭头：交叉开关 → 前端分组框 -->
    <line x1="280" y1="190" x2="302.0" y2="190.0" stroke="#475569" stroke-width="1.8"/><polygon points="310,190 301.0,194.9 301.0,185.1" fill="#475569"/>
    <line x1="280" y1="360" x2="302.0" y2="360.0" stroke="#475569" stroke-width="1.8"/><polygon points="310,360 301.0,364.9 301.0,355.1" fill="#475569"/>

    <!-- 内部箭头：前端 0 ↔ 目录 -->
    <line x1="610" y1="180" x2="632.0" y2="180.0" stroke="#475569" stroke-width="1.8"/><polygon points="640,180 631.0,184.9 631.0,175.1" fill="#475569"/>
    <text x="625" y="170" text-anchor="middle" font-size="11" fill="#475569">查询</text>
    <line x1="640" y1="222" x2="618.0" y2="222.0" stroke="#475569" stroke-width="1.8"/><polygon points="610,222 619.0,217.1 619.0,226.9" fill="#475569"/>
    <text x="625" y="240" text-anchor="middle" font-size="11" fill="#475569">回答</text>

    <!-- 内部箭头：前端 1 ↔ 目录 -->
    <line x1="610" y1="330" x2="632.0" y2="330.0" stroke="#475569" stroke-width="1.8"/><polygon points="640,330 631.0,334.9 631.0,325.1" fill="#475569"/>
    <text x="625" y="320" text-anchor="middle" font-size="11" fill="#475569">查询</text>
    <line x1="640" y1="372" x2="618.0" y2="372.0" stroke="#475569" stroke-width="1.8"/><polygon points="610,372 619.0,367.1 619.0,376.9" fill="#475569"/>
    <text x="625" y="390" text-anchor="middle" font-size="11" fill="#475569">回答</text>

    <!-- 内部箭头：前端分组框 ↔ 后端 -->
    <line x1="420" y1="436" x2="420.0" y2="462.0" stroke="#475569" stroke-width="1.8"/><polygon points="420,470 415.1,461.0 424.9,461.0" fill="#475569"/>
    <text x="432" y="456" font-size="11" fill="#475569">处方 · 任务</text>
    <line x1="520" y1="470" x2="520.0" y2="444.0" stroke="#475569" stroke-width="1.8"/><polygon points="520,436 525.0,445.0 515.0,445.0" fill="#475569"/>
    <text x="532" y="456" font-size="11" fill="#475569">清 PoS · 唤醒</text>

    <!-- 内部箭头：后端 → 目录（改账 · 上锁） -->
    <line x1="700" y1="470" x2="700.0" y2="428.0" stroke="#475569" stroke-width="1.8"/><polygon points="700,420 705.0,429.0 695.0,429.0" fill="#475569"/>
    <text x="710" y="448" font-size="11" fill="#475569">改账 · 上锁</text>

    <!-- 内部箭头：后端 ↔ 数据 -->
    <line x1="740" y1="530" x2="772.0" y2="530.0" stroke="#475569" stroke-width="1.8"/><polygon points="780,530 771.0,535.0 771.0,525.0" fill="#475569"/>
    <text x="760" y="521" text-anchor="middle" font-size="11" fill="#475569">差遣</text>
    <line x1="780" y1="553" x2="748.0" y2="553.0" stroke="#475569" stroke-width="1.8"/><polygon points="740,553 749.0,548.0 749.0,558.0" fill="#475569"/>
    <text x="760" y="568" text-anchor="middle" font-size="11" fill="#475569">数据</text>

    <!-- 越界箭头（通往 HomeWrapper） -->
    <line x1="20" y1="200" x2="122.0" y2="200.0" stroke="#2563eb" stroke-width="2"/><polygon points="130,200 121.0,204.9 121.0,195.1" fill="#2563eb"/>
    <text x="20" y="186" font-size="11.5" fill="#2563eb">REQ 新请求</text>
    <line x1="20" y1="520" x2="312.0" y2="520.0" stroke="#059669" stroke-width="2"/><polygon points="320,520 311.0,525.0 311.0,515.0" fill="#059669"/>
    <text x="20" y="504" font-size="11.5" fill="#059669">RSP 回程——直达后端，不经过前端</text>
    <line x1="910" y1="652" x2="910.0" y2="588.0" stroke="#d97706" stroke-width="2"/><polygon points="910,580 915.0,589.0 905.0,589.0" fill="#d97706"/>
    <text x="898" y="622" text-anchor="end" font-size="11.5" fill="#d97706">DAT 回程——直达数据部分</text>
    <line x1="470" y1="580" x2="470.0" y2="644.0" stroke="#7c3aed" stroke-width="2"/><polygon points="470,652 465.1,643.0 474.9,643.0" fill="#7c3aed"/>
    <text x="482" y="622" font-size="11.5" fill="#7c3aed">出：RSP · SNP · ERQ</text>
    <line x1="1040" y1="520" x2="1090.0" y2="520.0" stroke="#7c3aed" stroke-width="2"/><polygon points="1098,520 1089.0,525.0 1089.0,515.0" fill="#7c3aed"/>
    <text x="1042" y="504" font-size="11.5" fill="#7c3aed">出：DAT</text>

    <!-- 脚注 -->
    <text x="560" y="684" text-anchor="middle" font-size="11" fill="#64748b">东江实例的边界外只有 HomeWrapper（两个 HF 站 ↔ 西江环）：入向由它送来，出向由它选 HF 站上环（3.2）</text>
  </g>
</svg>
